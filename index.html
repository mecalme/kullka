<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leitor de Rampa e Estoque</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h2>App de Rampa e Estoque</h2>

        <!-- Seleção de Modos / Ações -->
        <div class="actions">
            <button onclick="setModo('recebimento')">1. Recebimento Rampa</button>
            <button onclick="setModo('enderecar')">2. Endereçar Box</button>
        </div>

        <div id="modo-atual" style="text-align: center; margin-bottom: 10px; font-size: 14px; color: #666;">
            Selecione um modo acima para começar
        </div>

        <!-- Área da Câmera / Leitor -->
        <div id="interactive" class="viewport"></div>

        <!-- Painel de Revisão e Cadastro Temporário -->
        <div class="result-box" style="background: #e9ecef; margin-top: 15px; padding: 15px; border-radius: 6px;">
            <h3>Revisão de Dados Capturados</h3>
            <p><b>EAN Lido:</b> <span id="rev-ean">-</span></p>
            <p><b>Produto:</b> <span id="rev-nome">-</span></p>
            <p><b>Marca:</b> <span id="rev-marca">-</span></p>

            <!-- Botão para efetivar o cadastro após revisar -->
            <button id="btn-cadastrar" onclick="cadastrarProdutoTemporario()" style="margin-top: 10px; width: 100%; padding: 10px; background: #28a745; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; display: none;">
                Cadastrar no Sistema
            </button>
        </div>
    </div>

    <!-- Biblioteca QuaggaJS CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/quagga/0.12.1/quagga.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
