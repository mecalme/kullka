<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leitor de Rampa e Estoque</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h2>App de Rampa e Estoque</h2>

        <!-- Seleção de Modos / Ações -->
        <div class="actions">
            <button onclick="setModo('recebimento')">1. Recebimento Rampa</button>
            <button onclick="setModo('enderecar')">2. Endereçar Box</button>
        </div>

        <div id="modo-atual" style="text-align: center; margin-bottom: 10px; font-size: 14px; color: #666;">
            Selecione um modo acima para começar
        </div>

        <div class="manual-box" style="margin: 15px 0; background: #fff3cd; padding: 10px; border-radius: 4px;">
            <button onclick="testarCodigoManual()" style="padding: 6px 10px; background: #28a745; color: white; border: none; border-radius: 4px; cursor: pointer;">Buscar Manual</button>
        </div>

        <!-- Área da Câmera / Leitor (Versão Original Estável) -->
        <div id="interactive" class="viewport"></div>

        <!-- Resultado da Leitura -->
        <div class="result-box">
            <h3>Produto Identificado:</h3>
            <p id="produto-nome">Nenhum produto lido</p>
            <p id="produto-marca">-</p>
        </div>
    </div>

    <!-- Mantemos a biblioteca Quagga padrão -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/quagga/0.12.1/quagga.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
