<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leitor de Rampa e Estoque</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h2>App de Rampa e Estoque</h2>

        <div class="actions">
            <button onclick="setModo('recebimento')">1. Recebimento Rampa</button>
            <button onclick="setModo('enderecar')">2. Endereçar Box</button>
        </div>

        <div id="modo-atual" style="text-align: center; margin-bottom: 10px; font-size: 14px; color: #666;">
            Selecione um modo acima
        </div>

        <!-- Botão nativo que abre a câmera do celular de verdade -->
        <div style="text-align: center; margin: 20px 0;">
            <label for="camera-input" style="background: #007bff; color: white; padding: 12px 20px; border-radius: 6px; cursor: pointer; font-weight: bold; display: inline-block;">
                📸 Abrir Câmera do Celular
            </label>
            <input type="file" id="camera-input" accept="image/*" capture="environment" style="display: none;" onchange="processarFoto(event)">
        </div>

        <!-- Resultado da Leitura -->
        <div class="result-box">
            <h3>Produto Identificado:</h3>
            <p id="produto-nome">Nenhum produto lido</p>
            <p id="produto-marca">-</p>
        </div>
    </div>

    <!-- Biblioteca QuaggaJS CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/quagga/0.12.1/quagga.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
