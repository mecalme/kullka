<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leitor de Rampa e Estoque</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h2>App de Rampa e Estoque</h2>

        <!-- Seleção de Modos / Ações -->
        <div class="actions">
            <button onclick="setModo('recebimento')">1. Recebimento Rampa</button>
            <button onclick="setModo('enderecar')">2. Endereçar Box</button>
        </div>

        <div id="modo-atual" style="text-align: center; margin-bottom: 10px; font-size: 14px; color: #666;">
            Selecione um modo acima para começar
        </div>

        <!-- Área da Câmera / Leitor -->
        <div id="interactive" class="viewport"></div>

        <!-- Painel de Revisão e Complemento Manual -->
        <div class="result-box" id="painel-revisao" style="display: none;">
            <h3>Revisão e Dados de Lote</h3>
            
            <p><b>EAN:</b> <span id="rev-ean">-</span></p>
            
            <div class="form-group">
                <label>Nome do Produto / Peso:</label>
                <input type="text" id="input-nome" placeholder="Buscando na internet...">
            </div>

            <div class="form-group">
                <label>Lote:</label>
                <input type="text" id="input-lote" placeholder="Digite o lote da caixa/item">
            </div>

            <div class="form-group">
                <label>Data de Fabricação:</label>
                <input type="date" id="input-fabricacao">
            </div>

            <div class="form-group">
                <label>Data de Validade:</label>
                <input type="date" id="input-validade">
            </div>

            <!-- Botões de Ação -->
            <button onclick="cadastrarProdutoFinal()" style="background: #28a745;">
                Confirmar e Cadastrar no Sistema
            </button>
            <button onclick="cancelarRevisao()" style="background: #dc3545; margin-top: 8px;">
                Cancelar / Ler Outro
            </button>
        </div>
    </div>

    <!-- Biblioteca QuaggaJS CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/quagga/0.12.1/quagga.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
